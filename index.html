<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro de Interessado</title>

<style>
:root{
  --verde-principal:#708C3D;
  --verde-escuro:#39461A;
  --bege:#F5F2EA;
  --branco:#FFFFFF;
}

*{
  box-sizing:border-box;
}

body{
  font-family:'Segoe UI', Arial, sans-serif;
  background:var(--bege);
  max-width:800px;
  margin:auto;
  padding:25px;
  color:#333;
}

h2{
  text-align:center;
  color:var(--verde-escuro);
  font-size:32px;
  margin-bottom:25px;
}

form{
  background:var(--branco);
  padding:35px;
  border-radius:30px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:8px;
  color:var(--verde-escuro);
  font-weight:600;
}

input,
select,
textarea{
  width:100%;
  padding:14px;
  border:1px solid #dcdcdc;
  border-radius:14px;
  font-size:16px;
  background:white;
  transition:.3s;
}

input:focus,
select:focus,
textarea:focus{
  outline:none;
  border-color:var(--verde-principal);
  box-shadow:0 0 0 4px rgba(112,140,61,.15);
}

textarea{
  min-height:120px;
}

button{
  width:100%;
  margin-top:25px;
  padding:16px;
  border:none;
  border-radius:40px;
  background:linear-gradient(
      90deg,
      var(--verde-escuro),
      var(--verde-principal)
  );
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  transform:translateY(-2px);
}

#localizacao-card{

  background:white;

  padding:25px;

  margin-bottom:25px;

  border-radius:25px;

  border-left:6px solid var(--verde-principal);

  box-shadow:0 10px 30px rgba(0,0,0,.08);

}

#localizacao-card h3{

  color:var(--verde-escuro);

  margin-bottom:12px;

}

#localizacao-card p{

  line-height:1.6;

  color:#555;

  margin-bottom:15px;

}

#status-localizacao{

  font-weight:bold;

  font-size:16px;

}
#btn-localizacao{

  width:100%;

  margin-top:15px;

  padding:12px;

  border:none;

  border-radius:30px;

  background:#708C3D;

  color:white;

  font-weight:bold;

  cursor:pointer;

}

#btn-localizacao:hover{

  opacity:0.9;

}
  

@media(max-width:768px){

  body{
    padding:15px;
  }

  form{
    padding:25px;
    border-radius:20px;
  }

  h2{
    font-size:26px;
  }

}

</style>

</head>
<body>

  <div id="localizacao-card">

    <h3>📍 Verificação de Localização</h3>

    <p>
        Para prosseguir com o cadastro, é necessário permitir o acesso à sua localização.
        Essa informação é utilizada exclusivamente para validação do interesse no imóvel.
    </p>

    <div id="status-localizacao">
        ⏳ Aguardando autorização...
    </div>

    <button
    type="button"
    id="btn-localizacao"
    onclick="solicitarLocalizacao()"
    style="display:none;"
>
    📍 Permitir Localização
</button>

</div>

<h2>🏡 CADASTRO DE INTERESSE EM LOCAÇÃO</h2>

<form id="formulario">

<label>Nome Completo</label>
<input type="text" id="nome" required>

<label>Telefone / WhatsApp</label>
<input type="tel" id="telefone" required>

<label>Quantidade de Moradores</label>
<input type="number" id="pessoas" required>

<label>Empresa onde trabalha</label>
<input type="text" id="empresa" required>

<label>Cargo/Função</label>
<input type="text" id="cargo">

<label>Renda Mensal Aproximada</label>
<input type="number" id="renda">

<label>Possui Animais?</label>
<select id="animais">
<option>Não</option>
<option>Sim</option>
</select>

<label>Observações</label>
<textarea id="observacoes"></textarea>

<button type="submit">
Enviar Cadastro
</button>

</form>

<script>
let latitude = "";
let longitude = "";
let localizacaoPermitida = false;

const statusLocalizacao =
document.getElementById("status-localizacao");

const btnLocalizacao =
document.getElementById("btn-localizacao");

function solicitarLocalizacao(){

    navigator.geolocation.getCurrentPosition(

        function(pos){

            latitude = pos.coords.latitude;
            longitude = pos.coords.longitude;

            localizacaoPermitida = true;

            statusLocalizacao.innerHTML =
            "✅ Localização validada. Você já pode preencher o cadastro.";

            statusLocalizacao.style.color = "#4CAF50";

            btnLocalizacao.style.display = "none";

        },

        function(){

            localizacaoPermitida = false;

            statusLocalizacao.innerHTML =
            "❌ Localização não autorizada. Clique no botão abaixo para tentar novamente.";

            statusLocalizacao.style.color = "#D32F2F";

            btnLocalizacao.style.display = "block";
          
           alert("FUNÇÃO DE ERRO EXECUTADA");

        }

    );

}

solicitarLocalizacao();
  
document.getElementById('formulario')
.addEventListener('submit', async function(e){

e.preventDefault();
  
if(!localizacaoPermitida){

    alert(
      "Para enviar o cadastro é necessário permitir o acesso à localização."
    );

    return;
}
const dados = {

nome: document.getElementById('nome').value,
telefone: document.getElementById('telefone').value,
pessoas: document.getElementById('pessoas').value,
empresa: document.getElementById('empresa').value,
cargo: document.getElementById('cargo').value,
renda: document.getElementById('renda').value,
animais: document.getElementById('animais').value,
observacoes: document.getElementById('observacoes').value,
latitude: latitude,
longitude: longitude

};

await fetch(
'https://script.google.com/macros/s/AKfycbw9o_BPAM1_BpD5KBC7lkip1MLCSQFTVLo5m7g4N389Odkw4VnLNh2QQY32r9H95FA8hA/exec',
{
method:'POST',
body: JSON.stringify(dados)
}
);

alert('Cadastro enviado com sucesso!');

this.reset();

});

</script>

</body>
</html>
